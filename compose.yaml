
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ai-document-backend:day6
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      - chroma_data:/app/chroma_db
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ai-document-frontend:day6
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
  huggingface_cache:
